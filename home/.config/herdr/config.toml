onboarding = false
[keys]
# Tap the right Command key, release it, then press the Herdr action key.
# Right Command is not a key a terminal can transmit, so macOS remaps it to F12
# at the HID layer (scripts/apply-herdr-prefix) and Herdr binds F12. The prefix
# therefore arrives as the ordinary "\e[24~" that every terminal and every ssh
# hop already carries, so it behaves identically locally and on a remote server.
# F13 looks like the tidier choice and is not: Herdr ignores its "\e[25~".
prefix = "f12"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+double_quote"
split_vertical    = "prefix+percent"
new_tab   = "prefix+c"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
goto             = "prefix+g"
copy_mode  = "prefix+y"  # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[ui]
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"

[ui.toast]
delivery = "off"
